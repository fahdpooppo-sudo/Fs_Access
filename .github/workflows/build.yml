name: Build F-Access APK

on:
  workflow_dispatch:
  push:
    paths:
      - "F-Access-Android-Project.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Check project archive
        shell: bash
        run: |
          if [ ! -f "F-Access-Android-Project.zip" ]; then
            echo "::error::ضع F-Access-Android-Project.zip في جذر المستودع بجانب مجلد .github"
            exit 1
          fi

      - name: Extract Android project
        shell: bash
        run: |
          mkdir -p extracted-project
          unzip -q "F-Access-Android-Project.zip" -d extracted-project

          if [ ! -f "extracted-project/settings.gradle" ]; then
            echo "::error::لم يتم العثور على settings.gradle داخل الملف المضغوط"
            find extracted-project -maxdepth 4 -type f | head -80
            exit 1
          fi

          echo "PROJECT_DIR=$GITHUB_WORKSPACE/extracted-project" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

       - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        shell: bash
        run: |
          gradle -p "$PROJECT_DIR" --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: F-Access-debug
          path: extracted-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
